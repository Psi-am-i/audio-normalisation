name: Release builds

# Builds the distributable apps. PyInstaller cannot cross-compile, so each OS
# bundle is produced on a runner of that OS:
#   - windows-latest -> VTNormal-windows.zip (.exe onedir + ffmpeg.exe)
#   - macos-latest   -> VTNormal-macos.zip   (.app, Apple Silicon)
# On a v* tag the zips are attached to a GitHub release. Also runnable by hand
# from the Actions tab (workflow_dispatch) to get artifacts without a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No Tk and no virtual display any more: the interface is HTML in a
      # webview, and the smoke test deliberately checks the shell/page contract
      # without opening a window. ffmpeg is the only requirement.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Format engine tests (all formats + bitrates, LUFS re-measured)
        run: python3 tests/test_formats.py
      - name: GUI smoke test (shell/page contract, no display needed)
        run: python3 tests/test_gui_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download static ffmpeg (GPL build, gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffbuild
          $ff = Get-ChildItem ffbuild -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName "$env:GITHUB_WORKSPACE\ffmpeg.exe"
          & "$env:GITHUB_WORKSPACE\ffmpeg.exe" -version | Select-Object -First 1
      - name: Generate background + install build deps
        run: |
          pip install pillow pyinstaller pywebview
          python packaging/make_bg.py
      - name: PyInstaller build
        env:
          FFMPEG_BINARY_PATH: ${{ github.workspace }}\ffmpeg.exe
        run: pyinstaller --clean --noconfirm --distpath dist-win --workpath build-win packaging/normalizer-gui-win.spec
      # pywebview's Windows host is webview.platforms.winforms running on
      # pythonnet. If those are missing the app opens a window and HANGS with no
      # error — it is not a crash, so nothing is logged and nothing exits
      # non-zero. Fail the build here instead of shipping that.
      - name: Verify the .NET/pywebview host is bundled
        shell: bash
        run: |
          set -e
          root=dist-win/VTNormal
          toc=$(find build-win -name 'Analysis-00.toc' | head -1)
          fail=0

          # Loose files on disk: binaries and data only. Pure-Python modules are
          # NOT here — with noarchive=False they live inside the PYZ archive, so
          # looking for winforms.pyc on disk always "fails" even when it is
          # correctly bundled.
          need_file() {
            if find "$root" -iname "$1" | grep -q .; then echo "  ok   $1"
            else echo "  MISSING  $1"; fail=1; fi
          }
          # Modules: check what Analysis actually collected.
          need_mod() {
            if grep -q "'$1'" "$toc"; then echo "  ok   $1"
            else echo "  MISSING  $1"; fail=1; fi
          }

          echo "Binaries / data on disk:"
          need_file "Python.Runtime.dll"     # pythonnet <-> .NET bridge
          need_file "ffmpeg.exe"
          need_file "vtdn_app.html"

          # The background is a data: URI inside the HTML, not a separate file.
          # Checking only that SOME image is inlined is not enough: when the
          # texture was gitignored, make_bg.py fell back to a flat procedural
          # gradient and the apps shipped with no texture at all — and this
          # check happily passed. The gradient is ~28 KB; a real texture is
          # hundreds. Assert on size so the fallback cannot ship unnoticed.
          page=$(find "$root" -name vtdn_app.html | head -1)
          if [ -z "$page" ]; then
            echo "  MISSING  vtdn_app.html"; fail=1
          else
            bytes=$(wc -c < "$page")
            echo "  interface page: $((bytes / 1024)) KB"
            if ! grep -q "url(.data:image" "$page"; then
              echo "  MISSING  background inlined as a data: URI"; fail=1
            elif [ "$bytes" -lt 300000 ]; then
              echo "  MISSING  a real background texture — page is only"
              echo "           $((bytes / 1024)) KB, so make_bg.py almost certainly"
              echo "           fell back to the procedural gradient."
              fail=1
            else
              echo "  ok   background inlined, and big enough to be the real texture"
            fi
          fi

          echo "Modules collected (from $toc):"
          need_mod "webview.platforms.winforms"      # the actual Windows host
          need_mod "webview.platforms.edgechromium"  # the WebView2 renderer
          need_mod "clr"                             # pythonnet entry point
          need_mod "clr_loader"

          if [ "$fail" -ne 0 ]; then
            echo "ERROR: the Windows bundle is missing components the GUI needs to start."
            echo "The app would open a window and hang, with nothing logged."
            exit 1
          fi

      - name: Add licenses + README, zip
        shell: bash
        run: |
          source packaging/lib_licenses.sh
          FFVER="$(./ffmpeg.exe -version | head -1)"
          write_ffmpeg_licenses "dist-win/VTNormal/licenses" "$FFVER"
          # Canonical recipient README, shared with the macOS build
          cp packaging/APP_README.txt dist-win/VTNormal/README.txt
          cd dist-win && 7z a ../VTNormal-windows.zip VTNormal
      - uses: actions/upload-artifact@v4
        with:
          name: VTNormal-windows
          path: VTNormal-windows.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # A universal2 interpreter is what lets the build produce a universal app
      # (Apple Silicon + Intel). setup-python's macOS builds are universal2;
      # build_gui_app.sh checks and falls back to a native build with a warning
      # if it ever isn't, rather than mislabelling the result.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Report interpreter architecture
        run: lipo -archs "$(python3 -c 'import sys; print(sys.executable)')" || true
      - name: Generate background (repo has no personal photo)
        run: |
          python3 -m venv bgvenv
          bgvenv/bin/pip install --quiet pillow
          bgvenv/bin/python packaging/make_bg.py
      - name: Build .app
        env:
          PYTHON: python3
        run: packaging/build_gui_app.sh
      - name: Rename zip
        run: mv packaging/dist-gui/VTNormal.zip VTNormal-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VTNormal-macos
          path: VTNormal-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release and attach builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            VTNormal-windows.zip VTNormal-macos.zip \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber VTNormal-windows.zip VTNormal-macos.zip
